services:
  postgres:
    image: postgres:17-alpine
    container_name: clip-campaigns-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clip_campaigns
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates the separate test database on first boot
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clip_campaigns"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
